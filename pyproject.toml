[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "unlockops"
version = "0.1.0"
description = "Approval-gated access diagnosis with LangGraph and two MCP servers"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "langchain-openai>=1.0,<2",
  "mcp>=1.20,<2",
  "aio-pika>=9.5,<10",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
where = ["agent", "rag", "mcp", "worker"]
include = ["unlockops*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["agent/tests", "mcp/tests", "tests"]
