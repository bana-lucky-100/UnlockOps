# Used only by scripts/evaluate_phase2.py with a fresh, unique project name.
# No published ports; no user's .env, DB, queues or checkpoint volume is reused.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: phase2_eval
      POSTGRES_USER: evaluator
      POSTGRES_PASSWORD: isolated-evaluation-only
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, evaluator, -d, phase2_eval]
      interval: 3s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: evaluator
      RABBITMQ_DEFAULT_PASS: isolated-evaluation-only
    volumes: [rabbit-data:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/phase2_eval
      DB_USER: evaluator
      DB_PASSWORD: isolated-evaluation-only
      RABBIT_HOST: rabbitmq
      RABBIT_USER: evaluator
      RABBIT_PASSWORD: isolated-evaluation-only
      DEMO_ENABLED: "true"
      DEMO_PASSWORD: isolated-evaluation-only
      PHASE2_RECLAIM_SCHEDULE_ENABLED: "false"
      INTERNAL_API_TOKEN: phase2-isolated-evaluation-token
      ACCESS_MATRIX_PATH: /app/data/company-a-access-matrix.md
    volumes: [../data:/app/data:ro]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://localhost:8080/api/health']
      interval: 3s
      timeout: 5s
      retries: 60
  policy-mcp:
    build: {context: .., dockerfile: infra/python.Dockerfile}
    command: [python, -m, unlockops_mcp.policy]
    environment: &mcp-env
      BACKEND_INTERNAL_URL: http://backend:8080
      INTERNAL_API_TOKEN: phase2-isolated-evaluation-token
      MCP_TOKEN: phase2-isolated-mcp-token
    depends_on:
      backend: {condition: service_healthy}
  business-mcp:
    build: {context: .., dockerfile: infra/python.Dockerfile}
    command: [python, -m, unlockops_mcp.business]
    environment: *mcp-env
    depends_on:
      backend: {condition: service_healthy}
  agent:
    build: {context: .., dockerfile: infra/python.Dockerfile}
    command: [python, -m, unlockops_worker]
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: evaluator
      RABBIT_PASSWORD: isolated-evaluation-only
      POLICY_MCP_URL: http://policy-mcp:8000/mcp
      BUSINESS_MCP_URL: http://business-mcp:8000/mcp
      MCP_TOKEN: phase2-isolated-mcp-token
      # scripts/evaluate_phase2.py --agent-mode llm sets these; default stays model-free.
      AGENT_MODE: ${EVAL_AGENT_MODE:-demo}
      LLM_API_KEY: ${EVAL_LLM_API_KEY:-}
      LLM_BASE_URL: ${EVAL_LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${EVAL_LLM_MODEL:-}
      CHECKPOINT_PATH: /state/checkpoints.sqlite
    volumes: [agent-state:/state]
    depends_on:
      backend: {condition: service_healthy}
      policy-mcp: {condition: service_healthy}
      business-mcp: {condition: service_healthy}
    healthcheck: {disable: true}
  frontend:
    build:
      context: ../frontend
      args: {RUN_TESTS: "true"}
    depends_on:
      backend: {condition: service_healthy}
  evaluator:
    profiles: [evaluation]
    build: {context: .., dockerfile: infra/python.Dockerfile}
    command: [python, /eval/scripts/phase2/run_suite.py, /eval/bundle.json]
    environment:
      EVAL_PASSWORD: isolated-evaluation-only
      INTERNAL_API_TOKEN: phase2-isolated-evaluation-token
    volumes:
      - ../scripts:/eval/scripts:ro
      - ${PHASE2_EVAL_INPUT:?Use scripts/evaluate_phase2.py}:/eval/bundle.json:ro
    healthcheck: {disable: true}
volumes:
  postgres-data:
  rabbit-data:
  agent-state:
